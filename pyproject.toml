[tool.poetry]
name = "lab4-csa"
version = "0.1.0"
description = "Stack processor simulator and translator"
authors = ["Alex"]

package-mode = false

[tool.poetry.dependencies]
python = "^3.11"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
pytest-golden = "^0.2.2"
ruff = "^0.5.0"
mypy = "^1.10.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "I",   # imports
    "B",   # bugbear
    "UP",  # pyupgrade
]

ignore = []

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"

strict = true

warn_unused_configs = true
warn_return_any = true
warn_unused_ignores = true

disallow_untyped_defs = true
disallow_incomplete_defs = true

check_untyped_defs = true

no_implicit_optional = true

pretty = true